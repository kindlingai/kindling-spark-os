# The image carries no ssh host keys (customize.sh deletes the ones openssh's postinst made); the
# initramfs copies in the box's own from the DGX OS disk. If that disk has none, generate them here
# rather than let sshd fail its config check. ssh-keygen -A only creates keys that are missing.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
